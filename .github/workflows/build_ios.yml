name: Build latest (iOS)
# run manually, or from the release all workflow
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ios
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 10
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # Use whichever Xcode and iOS SDK the runner image defaults to, as older macOS images
      #  (and the Xcode versions only they have) get retired over time
      - name: Setup environment
        run: |
          XCODE_DIR=$(xcode-select -p)
          echo "XCODE_APP=$(basename "$(dirname "$(dirname "$XCODE_DIR")")")" >> "$GITHUB_ENV"
          echo "IOS_SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)" >> "$GITHUB_ENV"
          cat "$GITHUB_ENV"

      # Xcode 16 and later can't link 32 bit (armv7) apps anymore
      - name: Compile iOS build
        run: |
          make ios IOS_32BIT=0

#      - name: Compile iOS simulator build
#        run: |
#          make IOS_SIM=1 ios

          
      - uses: ./.github/actions/upload_build
        with:
          SOURCE_FILE: 'ClassiCube-iPhoneOS.ipa'
          DEST_NAME: 'cc.ipa'
          
#      - uses: ./.github/actions/upload_build
#        with:
#          SOURCE_FILE: 'ClassiCube-iPhoneSimulator.ipa'
#          DEST_NAME: 'cc-simulator.ipa'
          
          
      - uses: ./.github/actions/notify_success
        with:
          DESTINATION_URL: '${{ secrets.NOTIFY_URL }}'
          WORKFLOW_NAME: 'ios'


      - uses: ./.github/actions/notify_failure
        if: failure()
        with:
          NOTIFY_MESSAGE: 'Failed to produce iOS build'
          WEBHOOK_URL: '${{ secrets.WEBHOOK_URL }}'
